name: Deploy mock front-end to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: gobdash-front

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /gobdash-online/
      VITE_MOCK_MODE: "true"
      VITE_API_BASE_URL: /api
      VITE_SOCKET_BASE_URL: ws://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gobdash-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mock application
        run: npm run build:mock

      - name: Add SPA fallback
        run: cp build/client/index.html build/client/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gobdash-front/build/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
